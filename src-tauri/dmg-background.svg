<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#eee6da"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="url(#paper)"/>
  <rect width="660" height="270" fill="url(#glow)"/>
  <circle cx="330" cy="244" r="130" fill="#8f7962" opacity=".045" filter="url(#softShadow)"/>

  <text x="330" y="55" text-anchor="middle" fill="#231e1a"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="23" font-weight="600" letter-spacing="-.4">Install mdbar</text>
  <text x="330" y="82" text-anchor="middle" fill="#756a5f"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="13">Drag the app into Applications</text>

  <path d="M274 223h100" fill="none" stroke="#8c7f73" stroke-width="2.2"
        stroke-linecap="round" stroke-dasharray="5 8"/>
  <path d="m365 214 12 9-12 9" fill="none" stroke="#8c7f73" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="102" y="334" width="456" height="1" fill="#2f2822" opacity=".09"/>
  <text x="330" y="364" text-anchor="middle" fill="#8a7f74"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="11">Plain markdown notes, one shortcut away.</text>
</svg>
