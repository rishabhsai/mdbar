name: mdbar
configFiles:
  Debug: Config/Sync.xcconfig
  Release: Config/Sync.xcconfig
options:
  bundleIdPrefix: run.mdbar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  mdbar:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: mdbar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mdbar.app
        INFOPLIST_FILE: Config/mdbar-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Config/mdbar.entitlements
    dependencies:
      - target: mdbarWidgets
        embed: true
  mdbarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: mdbarWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mdbar.app.widgets
        INFOPLIST_FILE: Config/mdbarWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    entitlements:
      path: Config/mdbarWidgets.entitlements
  mdbarCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: mdbarCoreTests
    dependencies:
      - target: mdbar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mdbar.app.tests
schemes:
  mdbar:
    build:
      targets:
        mdbar: all
        mdbarWidgets: all
    test:
      targets:
        - mdbarCoreTests
